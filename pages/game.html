<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego - Trivia Guide</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>
        .question-card {
            max-width: 750px;
            margin: auto;
        }
        .question-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
        }
    </style>
</head>
<body class="bg-light">

    <div id="navbar-container"></div>

    <div class="container py-5">
        <div class="card shadow p-4 question-card">
            <h3 id="questionTitle" class="fw-bold"></h3>
            <img id="questionImage" class="question-img my-3 d-none" />

            <div id="optionsContainer" class="mt-3"></div>

            <button id="nextBtn" class="btn btn-primary mt-4 w-100 d-none">Siguiente</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const params = new URLSearchParams(window.location.search);
        const guideId = params.get("id");

        let preguntas = [];
        let index = 0;
        let score = 0;

        // Cargar navbar
        fetch("../components/navbar.html")
            .then(res => res.text())
            .then(html => document.getElementById("navbar-container").innerHTML = html);

        // Cargar preguntas
        fetch(`/src/php/getQuestions.php?id=${guideId}`)
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    preguntas = data.preguntas;
                    mostrarPregunta();
                }
            });

        function mostrarPregunta() {
            const p = preguntas[index];

            document.getElementById("questionTitle").textContent = p.pregunta;

            // Imagen
            const img = document.getElementById("questionImage");
            if (p.imagen && p.imagen !== "") {
                img.src = p.imagen;
                img.classList.remove("d-none");
            } else {
                img.classList.add("d-none");
            }

            // Opciones
            const opts = document.getElementById("optionsContainer");
            opts.innerHTML = "";

            p.opciones.forEach(op => {
                const btn = document.createElement("button");
                btn.className = "btn btn-outline-secondary w-100 my-2";
                btn.textContent = op.texto;

                btn.onclick = () => seleccionarRespuesta(op.correcta, btn);

                opts.appendChild(btn);
            });

            document.getElementById("nextBtn").classList.add("d-none");
        }

        function seleccionarRespuesta(correcta, btn) {
            const botones = document.querySelectorAll("#optionsContainer button");
            botones.forEach(b => b.disabled = true);

            if (correcta) {
                btn.classList.remove("btn-outline-secondary");
                btn.classList.add("btn-success");
                score++;
            } else {
                btn.classList.remove("btn-outline-secondary");
                btn.classList.add("btn-danger");
            }

            document.getElementById("nextBtn").classList.remove("d-none");
        }

        document.getElementById("nextBtn").onclick = () => {
            index++;

            if (index >= preguntas.length) {
                window.location.href = `game-end.html?id=${guideId}&score=${score}`;
                return;
            }

            mostrarPregunta();
        };
    </script>

</body>
</html>
