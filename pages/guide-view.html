<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Información de la Guía</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>
        .guide-image {
            width: 100%;
            max-width: 350px;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
        }
    </style>
</head>
<body class="bg-light">

    <!-- NAVBAR opcional -->
    <div id="navbar-container"></div>

    <div class="container py-5">
        <div class="card shadow p-4">
            <div class="row">
                
                <!-- Columna Imagen -->
                <div class="col-md-4 text-center">
                    <img id="guideImage" class="guide-image" src="" alt="Guía">
                </div>

                <!-- Columna Información -->
                <div class="col-md-8">

                    <h2 id="guideTitle" class="fw-bold mb-3"></h2>

                    <p id="guideDescription" class="text-secondary"></p>

                    <div class="mt-3">
                        <p><strong>Categoría:</strong> <span id="guideCategory"></span></p>
                        <p><strong>Dificultad:</strong> <span id="guideDifficulty"></span></p>
                        <p><strong>Preguntas:</strong> <span id="guideQuestions"></span></p>
                    </div>

                    <!-- BOTÓN JUGAR -->
                    <a id="playBtn" href="#" class="btn btn-primary btn-lg mt-3">
                        Jugar esta guía
                    </a>

                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // ------------------------------
        // Obtener ID de la URL
        // ------------------------------
        const params = new URLSearchParams(window.location.search);
        const guideId = params.get("id");

        if (!guideId) {
            alert("No se proporcionó una guía.");
        }

        // ------------------------------
        // Cargar información de la guía
        // ------------------------------
        fetch(`/src/php/getGuide.php?id=` + guideId)
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    const g = data.guia;

                    document.getElementById("guideTitle").textContent = g.titulo;
                    document.getElementById("guideDescription").textContent = g.descripcion;
                    document.getElementById("guideCategory").textContent = g.categoria;
                    document.getElementById("guideDifficulty").textContent = g.dificultad;
                    document.getElementById("guideQuestions").textContent = g.totalPreguntas;
                    document.getElementById("guideImage").src = g.imagen;

                    // Enlace del botón jugar
                    document.getElementById("playBtn").href = "jugar.html?id=" + guideId;

                } else {
                    alert("No se encontró la guía.");
                }
            })
            .catch(err => console.error(err));

        // ------------------------------
        // Cargar Navbar
        // ------------------------------
        fetch("navbar.html")
            .then(res => res.text())
            .then(html => document.getElementById("navbar-container").innerHTML = html);
    </script>

</body>
</html>
