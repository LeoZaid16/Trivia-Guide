<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Preguntas</title>
    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="/assets/img/logo/logo-tab.png" />
    <!-- BOOTSTRAP 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <style>
        .navbar-logo {
            height: 44px !important;
            width: auto !important;
            object-fit: contain !important;
        }

        body {
            margin-top: 60px;
            background: #f4f6f9;
            font-family: system-ui, sans-serif;
        }

        .question-box {
            background: white;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 20px;
            border-left: 6px solid var(--clr, #0561ff);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.07);
        }

        .question-title {
            font-weight: bold;
            font-size: 17px;
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->
    <aside id="sideMenu" class="bg-white shadow"
        style="width:260px; position:fixed; top:0; left:-260px; height:100vh; transition:.3s; z-index:2000;">

        <div class="p-3 border-bottom d-flex justify-content-between align-items-center">
            <h5 class="fw-bold m-0">Menú</h5>
            <button id="closeSide" class="btn btn-link fs-4 text-dark">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>

        <ul class="list-group list-group-flush">
            <li class="list-group-item"><i class="bi bi-house-door me-2"></i> Inicio</li>
            <li class="list-group-item"><i class="bi bi-journal-bookmark me-2"></i> Mis Guías</li>
            <li class="list-group-item"><i class="bi bi-bar-chart-line me-2"></i> Progreso</li>
            <li class="list-group-item"><i class="bi bi-gear me-2"></i> Configuración</li>
        </ul>
    </aside>

    <!-- OVERLAY -->
    <div id="overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4);
               display:none; z-index:1500;"></div>

    <!-- NAVBAR (Responsive, coloured and styled) CENTERED WHEN SMALLER THAN SM -->
    <nav class="navbar navbar-light bg-light fixed-top" style="box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15)">

        <div class="container px-0 px-sm-5 d-flex flex-wrap justify-content-between align-items-center">

            <!-- SIDE MENU -->
            <button id="openSide" class="btn btn-link text-dark fs-4 me-2">
                <i class="bi bi-list" style="font-size: 1.5em;"></i>
            </button>

            <!-- BRAND LOGO -->
            <a class="navbar-brand" href="home.html">
                <img src="/assets/img/logo/logo.png" alt="Trivia Guide" class="navbar-logo" />
            </a>

            <!-- PROFILE BUTTON -->
            <button id="profileBtn" class="btn btn-link text-dark" data-bs-toggle="offcanvas"
                data-bs-target="#perfilCanvas">
                <img id="profileIcon" src="/assets/icons/Profile Icons/1.png" alt="Profile Icon" class="rounded-circle"
                    style="width: 60px; height: 60px; object-fit: cover;">
            </button>

        </div>
    </nav>

    <div class="container">

        <h2 class="fw-bold mb-2" id="tituloGuia"></h2>
        <p class="text-muted" id="descGuia"></p>

        <hr>

        <h4 class="fw-semibold">Agregar preguntas</h4>
        <p class="text-muted">Puedes agregar hasta 50 preguntas.</p>

        <!-- Contenedor donde se agregan las preguntas -->
        <div id="questionsContainer"></div>

        <!-- Botón agregar pregunta -->
        <button id="addQuestionBtn" class="btn btn-primary w-100 mt-3 fw-bold">➕ Agregar otra pregunta</button>

        <!-- Botón guardar -->
        <button id="guardarPreguntas" class="btn btn-success w-100 mt-3 fw-bold">💾 Guardar guía completa</button>

    </div>

    <script>
        // Cargar guía
        const guiaID = localStorage.getItem("guiaActualID");
        let guias = JSON.parse(localStorage.getItem("guias")) || [];
        let guia = guias.find(g => g.id == guiaID);

        document.getElementById("tituloGuia").textContent = guia.nombre;
        document.getElementById("descGuia").textContent = guia.descripcion;

        let questionCount = 0;
        const maxQ = 50;

        const container = document.getElementById("questionsContainer");
        const addBtn = document.getElementById("addQuestionBtn");

        // Agregar pregunta
        addBtn.addEventListener("click", () => {
            if (questionCount >= maxQ) {
                alert("Máximo 50 preguntas.");
                return;
            }

            questionCount++;

            const qid = questionCount;

            const card = `
        <div class="question-box" id="q${qid}" style="--clr:${guia.color}">
            <div class="d-flex justify-content-between">
                <span class="question-title">Pregunta ${qid}</span>
                <button class="btn btn-sm btn-danger" onclick="removeQ(${qid})">Eliminar</button>
            </div>

            <label class="fw-semibold mt-3">Escribe la pregunta:</label>
            <input type="text" class="form-control mb-3" id="preg_${qid}" placeholder="Escribe la pregunta">

            <label class="fw-semibold">Respuestas:</label>
            <input type="text" class="form-control mb-2" id="r${qid}_1" placeholder="Respuesta 1">
            <input type="text" class="form-control mb-2" id="r${qid}_2" placeholder="Respuesta 2">
            <input type="text" class="form-control mb-2" id="r${qid}_3" placeholder="Respuesta 3">
            <input type="text" class="form-control mb-2" id="r${qid}_4" placeholder="Respuesta 4">

            <label class="fw-semibold">Respuesta correcta:</label>
            <select id="correcta_${qid}" class="form-select">
                <option disabled selected>Selecciona la correcta</option>
                <option value="1">Respuesta 1</option>
                <option value="2">Respuesta 2</option>
                <option value="3">Respuesta 3</option>
                <option value="4">Respuesta 4</option>
            </select>
        </div>`;

            container.insertAdjacentHTML("beforeend", card);
        });

        // Eliminar pregunta
        function removeQ(id) {
            document.getElementById(q${ id }).remove();
            questionCount--;
        }

        // Guardar preguntas
        document.getElementById("guardarPreguntas").addEventListener("click", () => {
            const preguntas = [];

            for (let i = 1; i <= questionCount + 5; i++) {
                const q = document.getElementById(q${ i });
                if (!q) continue;

                const p = document.getElementById(preg_${ i }).value.trim();
                const r1 = document.getElementById(r${ i }_1).value.trim();
                const r2 = document.getElementById(r${ i }_2).value.trim();
                const r3 = document.getElementById(r${ i }_3).value.trim();
                const r4 = document.getElementById(r${ i }_4).value.trim();
                const correcta = document.getElementById(correcta_${ i }).value;

                if (!p || !r1 || !r2 || !r3 || !r4 || !correcta) {
                    alert("Completa todas las preguntas antes de guardar.");
                    return;
                }

                preguntas.push({
                    pregunta: p,
                    respuestas: [r1, r2, r3, r4],
                    correcta: parseInt(correcta)
                });
            }

            guia.preguntas = preguntas;
            localStorage.setItem("guias", JSON.stringify(guias));

            alert("¡Guía guardada con éxito!");
        });

        /* -------------------- SIDEBAR -------------------- */
        const sideMenu = document.getElementById("sideMenu");
        const openSide = document.getElementById("openSide");
        const closeSide = document.getElementById("closeSide");
        const overlay = document.getElementById("overlay");

        openSide.addEventListener("click", () => {
            sideMenu.style.left = "0";
            overlay.style.display = "block";
        });

        closeSide.addEventListener("click", closeSidebar);
        overlay.addEventListener("click", closeSidebar);

        function closeSidebar() {
            sideMenu.style.left = "-260px";
            overlay.style.display = "none";
        }
    </script>

</body>

</html>
