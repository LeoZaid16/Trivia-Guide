<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados - Trivia Guide</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>
        .result-card {
            max-width: 600px;
            margin: auto;
        }
        .big-score {
            font-size: 4rem;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-light">

    <div id="navbar-container"></div>

    <div class="container py-5">
        <div class="card shadow p-4 text-center result-card">

            <h2 class="fw-bold mb-3">¡Juego Terminado!</h2>

            <div class="big-score text-primary" id="scoreText"></div>

            <p id="detailsText" class="mt-3 text-secondary"></p>

            <div class="mt-4">
                <a id="playAgainBtn" class="btn btn-primary w-100 mb-2">Jugar otra vez</a>
                <a href="home.html" class="btn btn-outline-secondary w-100">Regresar al inicio</a>
            </div>

        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const guideId = params.get("id");
        const score = params.get("score");

        let total = 0;

        // Cargar navbar
        fetch("../components/navbar.html")
            .then(res => res.text())
            .then(html => document.getElementById("navbar-container").innerHTML = html);

        // Obtener total de preguntas
        fetch(`/src/php/getQuestions.php?id=${guideId}`)
            .then(res => res.json())
            .then(data => {
                total = data.preguntas.length;

                document.getElementById("scoreText").textContent = `${score} / ${total}`;
                document.getElementById("detailsText").textContent = `Tuviste ${score} respuestas correctas de un total de ${total} preguntas.`;

                document.getElementById("playAgainBtn").href = `game.html?id=${guideId}`;
            });
    </script>

</body>
</html>
