<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Guía</title>
    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="/assets/img/logo/logo-tab.png" />
    <!-- BOOTSTRAP 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <style>
        .navbar-logo {
            height: 44px !important;
            width: auto !important;
            object-fit: contain !important;
        }

        body {
            background: #f5f7fb;
            font-family: system-ui, sans-serif;
        }

        .color-option {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--clr);
            cursor: pointer;
            border: 3px solid transparent;
            transition: .2s;
        }

        .color-option.active,
        .color-option:hover {
            border-color: #000;
        }

        .img-option {
            width: 70px;
            height: 70px;
            border-radius: 12px;
            object-fit: cover;
            cursor: pointer;
            border: 3px solid transparent;
            transition: .2s;
        }

        .img-option.active {
            border-color: #000;
        }

        .continue-btn {
            background: #0561ff;
            border: none;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <!-- SIDEBAR -->
    <aside id="sideMenu" class="bg-white shadow"
        style="width:260px; position:fixed; top:0; left:-260px; height:100vh; transition:.3s; z-index:2000;">

        <div class="p-3 border-bottom d-flex justify-content-between align-items-center">
            <h5 class="fw-bold m-0">Menú</h5>
            <button id="closeSide" class="btn btn-link fs-4 text-dark">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>

        <ul class="list-group list-group-flush">
            <li class="list-group-item"><i class="bi bi-house-door me-2"></i> Inicio</li>
            <li class="list-group-item"><i class="bi bi-journal-bookmark me-2"></i> Mis Guías</li>
            <li class="list-group-item"><i class="bi bi-bar-chart-line me-2"></i> Progreso</li>
            <li class="list-group-item"><i class="bi bi-gear me-2"></i> Configuración</li>
        </ul>
    </aside>

    <!-- OVERLAY -->
    <div id="overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4);
               display:none; z-index:1500;"></div>

    <!-- NAVBAR (Responsive, coloured and styled) CENTERED WHEN SMALLER THAN SM -->
    <nav class="navbar navbar-light bg-light fixed-top" style="box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15)">

        <div class="container px-0 px-sm-5 d-flex flex-wrap justify-content-between align-items-center">

            <!-- SIDE MENU -->
            <button id="openSide" class="btn btn-link text-dark fs-4 me-2">
                <i class="bi bi-list" style="font-size: 1.5em;"></i>
            </button>

            <!-- BRAND LOGO -->
            <a class="navbar-brand" href="home.html">
                <img src="/assets/img/logo/logo.png" alt="Trivia Guide" class="navbar-logo" />
            </a>

            <!-- PROFILE BUTTON -->
            <button id="profileBtn" class="btn btn-link text-dark" data-bs-toggle="offcanvas"
                data-bs-target="#perfilCanvas">
                <img id="profileIcon" src="/assets/icons/Profile Icons/1.png" alt="Profile Icon" class="rounded-circle"
                    style="width: 60px; height: 60px; object-fit: cover;">
            </button>

        </div>
    </nav>

    <!-- CREATE A NEW GUIDE STRUCTURE -->
    <div class="container mt-5 pt-5">
        <h2 class="fw-bold">Crear nueva guía</h2>

        <div class="card border-0 shadow-sm p-4">

            <label class="fw-semibold">Nombre de la guía</label>
            <input id="nombreGuia" type="text" class="form-control mb-3" placeholder="Ej: Historia del Arte">

            <label class="fw-semibold">Descripción</label>
            <textarea id="descripcionGuia" class="form-control mb-3" rows="3"
                placeholder="Breve descripción de la guía"></textarea>

            <label class="fw-semibold">Categoría</label>
            <select id="categoriaGuia" class="form-select mb-3">
                <option value="" disabled selected>Selecciona una categoría</option>
                <option>Ciencias</option>
                <option>Matemáticas</option>
                <option>Historia</option>
                <option>Informática</option>
                <option>Biología</option>
                <option>Geografía</option>
                <option>Artes</option>
                <option>Física</option>
                <option>Química</option>
                <option>Economía</option>
                <option>Literatura</option>
                <option>Filosofía</option>
            </select>

            <!-- COLORES -->
            <label class="fw-semibold mt-2">Color de la guía</label>
            <div class="d-flex gap-3 my-2 flex-wrap">
                <div class="color-option" style="--clr:#4A90E2"></div>
                <div class="color-option" style="--clr:#6AAAF7"></div>
                <div class="color-option" style="--clr:#47CF73"></div>
                <div class="color-option" style="--clr:#A066FF"></div>
                <div class="color-option" style="--clr:#FF72A7"></div>
                <div class="color-option" style="--clr:#FFC04D"></div>
                <div class="color-option" style="--clr:#FF5252"></div>
                <div class="color-option" style="--clr:#12D8C5"></div>
            </div>

            <!-- IMÁGENES PREDEFINIDAS -->
            <label class="fw-semibold mt-3">Imagen para la guía</label>
            <div class="d-flex gap-3 flex-wrap mb-3">
                <img src="/assets/img/GuideImages/book.jpg" class="img-option">
                <img src="/assets/img/GuideImages/science.jpeg" class="img-option">
                <img src="/assets/img/GuideImages/Geography.jpg" class="img-option">
                <img src="/assets/img/GuideImages/math.jpg" class="img-option">
                <img src="/assets/img/GuideImages/art.jpg" class="img-option">
                <img src="/assets/img/GuideImages/economy.jpg" class="img-option">
                <img src="/assets/img/GuideImages/philosophy.jpg" class="img-option">
                <img src="/assets/img/GuideImages/biology.jpg" class="img-option">
            </div>

            <div class="p-3 bg-light rounded-3 d-flex justify-content-between align-items-center mt-4">
                <div>
                    <p class="mb-0 fw-semibold">Hacer guía pública</p>
                    <small class="text-muted">Otros usuarios podrán verla</small>
                </div>
                <div>
                    <div class="form-check form-switch">
                        <input id="publicaGuia" class="form-check-input" type="checkbox">
                    </div>
                </div>
            </div>

        </div>

        <button id="guardarGuia" class="btn continue-btn w-100 py-2 mt-4">Crear Guia</button>
    </div>

    <script>
        // PICK A COLOR
        document.querySelectorAll(".color-option").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".color-option").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
            });
        });

        // PICK AN IMAGE
        document.querySelectorAll(".img-option").forEach(img => {
            img.addEventListener("click", () => {
                document.querySelectorAll(".img-option").forEach(i => i.classList.remove("active"));
                img.classList.add("active");
            });
        });

        // SAVE GUIDE
        document.getElementById("guardarGuia").addEventListener("click", () => {
            const nombre = document.getElementById("nombreGuia").value;
            const descripcion = document.getElementById("descripcionGuia").value;
            const categoria = document.getElementById("categoriaGuia").value;
            const color = document.querySelector(".color-option.active")?.style.getPropertyValue("--clr") || "";
            const imagen = document.querySelector(".img-option.active")?.src;
            const publica = document.getElementById("publicaGuia").checked;

            if (!nombre || !descripcion || !categoria || !color || !imagen) {
                alert("Completa todos los campos.");
                return;
            }

            const nuevaGuia = {
                id: Date.now(),
                nombre,
                descripcion,
                categoria,
                color,
                imagenURL: imagen,
                publica
            };

            const guias = JSON.parse(localStorage.getItem("guias")) || [];
            guias.push(nuevaGuia);
            localStorage.setItem("guias", JSON.stringify(guias));

            // SAVE OPEN GUIDE ID
            localStorage.setItem("guiaActualID", nuevaGuia.id);

            // GO TO GUIDE-VIEW
            window.location.href = "guide-view.html";
        });

        /* -------------------- SIDEBAR -------------------- */
        const sideMenu = document.getElementById("sideMenu");
        const openSide = document.getElementById("openSide");
        const closeSide = document.getElementById("closeSide");
        const overlay = document.getElementById("overlay");

        openSide.addEventListener("click", () => {
            sideMenu.style.left = "0";
            overlay.style.display = "block";
        });

        closeSide.addEventListener("click", closeSidebar);
        overlay.addEventListener("click", closeSidebar);

        function closeSidebar() {
            sideMenu.style.left = "-260px";
            overlay.style.display = "none";
        }



        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("cardsContainer");
            const guiasGuardadas = JSON.parse(localStorage.getItem("guias")) || [];

            guiasGuardadas.forEach(guia => {

                const card = document.createElement("div");
                card.classList.add("col-md-6", "mb-4", "guide-item");
                card.setAttribute("data-title", guia.nombre);

                card.innerHTML = `
            <div class="guide-card" style="border-left-color:${guia.color};">
                <div class="d-flex p-3">

                    <img src="${guia.imagenURL}" class="guide-img me-3" style="object-fit:cover;">

                        <div class="flex-grow-1">
                            <h5 class="fw-bold mb-1">${guia.nombre}</h5>
                            <p class="text-muted small mb-2">${guia.descripcion}</p>
                            <span class="badge bg-light text-dark border">${guia.categoria}</span>
                        </div>

                        <div class="d-flex align-items-start">
                            <div class="color-dot" style="background:${guia.color};"></div>
                        </div>

                </div>
            </div>
        `;

                container.appendChild(card);
            });
        });

    </script>

</body>

</html>
